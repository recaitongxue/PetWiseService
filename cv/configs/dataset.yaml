# 数据配置（THU-Dogs）
# 本文件是「数据准备 / 训练」阶段所有数据相关参数的唯一来源；改这里即可，无需动 Python 代码。
# 命令行 --root 可覆盖下面的 dataset.root（便于 Docker 把数据挂到别的盘）。

dataset:
  # 原始数据根目录，内含 high-resolution / high-annotations / TrainAndValList
  # 支持相对路径（相对 cv/ 执行目录）或绝对路径
  root: datasets
  image_size: 224
  # 用 body 框裁剪去背景（THU-Dogs 自带 head/body 标注）。关掉则与通用分类一致。
  use_bbox: true
  seed: 42
  # 类平衡采样：长尾品种（尾部每类仅 ~160 张）被头部（最多 7409 张）淹没，
  # 开启后按类频反比加权，让稀有犬也得到充分训练。MVP 只训头部时可关。
  balanced_sampling: true
  # 类白名单（MVP 用）：只列出想训练的品种文件夹名；为空 = 全部 130 类。
  # 例：["1043-n000001-Shiba_Dog", "1121-n000002-French_bulldog", ...]
  classes: []
  # 测试集切分：官方 THU-Dogs 只有 train + validation，没有 test。
  # prepare 阶段会把 validation.lst 确定性切为 val.lst（早停/选模型）+ test.lst（独立评测），
  # 最终评测跑在 test 上，指标才可信（避免验证集既选模型又报分数导致偏乐观）。
  test_split: true
  test_ratio: 0.5          # val 占比，剩余归 test（默认 20/类 → 各 2600 张）

dataloader:
  batch_size: 64          # GPU 显存够可加大；A10/A100 建议 128~256
  num_workers: 8
  pin_memory: true

# 归一化（ImageNet）集中定义在 src/data/thudogs_meta.py 的 _NORM_MEAN/_NORM_STD，
# 与 services/vision/app/preprocess.py 共用同一组值；改两处需同步，否则线上精度会掉。
