# 训练配置（python -m src.train.run 读取）
# 实验记录：改这里就够了，不要改 Python 文件

model:
  backbone: resnet50              # resnet50 | efficientnet_b3 | efficientnet_b4 | swin_t | convnext_tiny
  pretrained: true
  num_classes: 130                # 仅作校验：run.py 会断言其与数据集实际类数一致
  epochs: 40
  lr: 0.0003
  weight_decay: 0.0001
  patience: 8                      # 早停轮数
  amp: true                        # 混合精度（GPU 必开）
  label_smoothing: 0.1            # 与 mixup/cutmix 互斥：启用任一时自动关闭
  mixup: 0.2                       # >0 开启 Mixup（长尾数据增强，推荐 0.2）；与 cutmix 二选一
  cutmix: 0.0                      # >0 开启 CutMix（更强空间增强）；mixup/cutmix 同时>0 时优先 cutmix

output:
  dir: artifacts
  save_name: best.pt

# 每次实验记录一行，论文表格直接引用
