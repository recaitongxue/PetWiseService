[project]
name = "petwise-cv"
version = "0.2.0"
description = "PetWise fine-grained visual classification (FGVC) — dog (THU-Dogs) & cat breed recognition"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.3",
    "torchvision>=0.18",
    "numpy>=1.26",
    "pillow>=10.3",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.1.0",
]

[project.scripts]
petwise-train = "common.train.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["common"]
addopts = "-q"
