# 本地开发依赖：只起中间件，不含业务服务
# 用法：docker compose -f infra/compose/compose.dev.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: petwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: petwise
      POSTGRES_PASSWORD: petwise
      POSTGRES_DB: petwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petwise -d petwise"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: petwise-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: petwise-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: petwise
      MINIO_ROOT_PASSWORD: petwise123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
