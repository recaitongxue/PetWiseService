# WebSocket 推送帧契约
# 与 docs/API.md 第 5 章完全对应，这里是机器可读版本。
#
# 规范：服务端 → 客户端

Frame:
  type: object
  required: [type, seq, timestamp, data]
  properties:
    type:
      type: string
      enum:
        - consult.message      # 问诊医生回复，data: {orderId, message}
        - consult.state        # 问诊单状态变更（接诊/结束），data: {orderId, state}
        - consult.call         # 通话呼入，data: {orderId, channel, token}
        - im.message           # IM 新消息，data: {conversationId, message}
        - notification         # 系统通知（公告/提醒），data: {title, body, level}
        - recognition.result   # 异步识别完成，data: {taskId, result}
        - pong                 # 心跳响应
        - error                # 错误，data: {code, message}
    seq:
      type: integer
      description: 单调递增序号，断线重连时按此增量拉取
    timestamp:
      type: integer
      description: 服务端毫秒时间戳
    data:
      type: object

# 客户端 → 服务端
ClientFrame:
  type: object
  required: [type]
  properties:
    type:
      type: string
      enum: [ping, consult.typing, consult.subscribe, consult.unsubscribe]
    data:
      type: object

Connection:
  url: wss://{host}/ws?token={accessToken}
  heartbeat_interval_sec: 25
  reconnect_backoff_sec: [1, 2, 4, 8, 30]
  note: 重连成功后按 seq 增量拉取离线消息
