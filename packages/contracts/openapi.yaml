openapi: 3.0.3

info:
  title: Petwise API
  description: >
    Petwise 宠物健康与在线问诊服务端接口。
    统一响应信封为 { code, message, data, timestamp, traceId }，code=0 表示成功。
    WebSocket 实时协议见 API.md 第 5 章。
  version: 1.0.0
  contact:
    name: Petwise 毕设项目

servers:
  - url: http://localhost:8080/api/v1
    description: 本地开发
  - url: https://api.petwise.example.com/api/v1
    description: 生产（示例）

tags:
  - name: auth
    description: 认证与用户
  - name: pets
    description: 宠物档案
  - name: schedule
    description: 日程与提醒
  - name: home
    description: 首页聚合
  - name: content
    description: 公告 · 反馈 · 品种 · 收藏
  - name: recognition
    description: 拍照识别
  - name: consult
    description: 在线问诊（AI 分诊 / 医生 / 问诊单 / 报告）
  - name: community
    description: 社区
  - name: im
    description: 即时消息
  - name: files
    description: 文件上传
  - name: admin
    description: 管理端

paths:
  # ---------------- 认证 ----------------
  /auth/verification-codes:
    post:
      tags: [auth]
      summary: 发送验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: '13800001111' }
                scene: { type: string, enum: [login, register, reset], default: login }
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          phoneMasked: { type: string, example: '138****1111' }
                          expiresIn: { type: integer, example: 60 }
                          cooldown: { type: integer, example: 60 }

  /auth/login:
    post:
      tags: [auth]
      summary: 登录（验证码 / 密码）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
                code: { type: string, description: '验证码登录时必填' }
                password: { type: string, description: '密码登录时必填' }
                mode: { type: string, enum: [sms, password], default: sms }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: 刷新 accessToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TokenPair' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [auth]
      summary: 登出
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /users/me:
    get:
      tags: [auth]
      summary: 获取当前用户
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
    patch:
      tags: [auth]
      summary: 更新当前用户资料
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                handle: { type: string }
                avatarUrl: { type: string }
                bio: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  # ---------------- 宠物 ----------------
  /pets:
    get:
      tags: [pets]
      summary: 宠物列表
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Pet' }
    post:
      tags: [pets]
      summary: 新建宠物
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetInput' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Pet' }

  /pets/{id}:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    get:
      tags: [pets]
      summary: 宠物详情
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PetDetail' }
    patch:
      tags: [pets]
      summary: 更新宠物
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetInput' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    delete:
      tags: [pets]
      summary: 删除宠物
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 删除成功 }

  /pets/{id}/health-trend:
    parameters:
      - { $ref: '#/components/parameters/PathId' }
      - name: week
        in: query
        schema: { type: string, example: '2026-41' }
    get:
      tags: [pets]
      summary: 周健康趋势
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          petId: { type: string }
                          week: { type: string }
                          points:
                            type: array
                            items: { $ref: '#/components/schemas/TrendPoint' }

  /pets/{id}/reminders:
    parameters:
      - { $ref: '#/components/parameters/PathId' }
      - name: date
        in: query
        schema: { type: string, format: date }
    get:
      tags: [pets]
      summary: 宠物当日提醒
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Reminder' }

  /pets/{id}/weights:
    parameters:
      - { $ref: '#/components/parameters/PathId' }
      - name: months
        in: query
        schema: { type: integer, default: 6 }
    get:
      tags: [pets]
      summary: 体重历史
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            m: { type: string, example: '10月' }
                            w: { type: number, example: 4.6 }
    post:
      tags: [pets]
      summary: 记录体重
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [weight]
              properties:
                weight: { type: number, example: 4.7 }
                date: { type: string, format: date }
      responses:
        '201': { $ref: '#/components/responses/Ok' }

  /pets/{id}/records:
    parameters:
      - { $ref: '#/components/parameters/PathId' }
      - name: kind
        in: query
        schema: { type: string, enum: [weight, diet, symptom, care] }
      - { $ref: '#/components/parameters/Page' }
      - { $ref: '#/components/parameters/PageSize' }
    get:
      tags: [pets]
      summary: 健康记录列表
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Page'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/HealthRecord' }
    post:
      tags: [pets]
      summary: 新增健康记录
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HealthRecordInput' }
      responses:
        '201': { $ref: '#/components/responses/Ok' }

  /records/{id}:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    delete:
      tags: [pets]
      summary: 删除健康记录
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 删除成功 }

  # ---------------- 日程 ----------------
  /schedule:
    parameters:
      - name: petId
        in: query
        schema: { type: string }
      - name: from
        in: query
        schema: { type: string, format: date }
      - name: to
        in: query
        schema: { type: string, format: date }
      - name: type
        in: query
        schema: { type: string, enum: [vaccine, deworm, check, weight, groom, other] }
    get:
      tags: [schedule]
      summary: 日程列表（合并系统周期与自建）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ScheduleItem' }
    post:
      tags: [schedule]
      summary: 新建日程
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleItemInput' }
      responses:
        '201': { $ref: '#/components/responses/Ok' }

  /schedule/types:
    get:
      tags: [schedule]
      summary: 日程类型字典
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AnyData' }

  /schedule/{id}:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    patch:
      tags: [schedule]
      summary: 更新日程
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleItemInput' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
    delete:
      tags: [schedule]
      summary: 删除日程（仅自建）
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 删除成功 }

  /schedule/{id}/done:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    patch:
      tags: [schedule]
      summary: 勾选完成（幂等）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean, example: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: string }
                          done: { type: boolean }

  # ---------------- 首页 ----------------
  /home:
    get:
      tags: [home]
      summary: 首页聚合数据
      security: [{ bearerAuth: [] }]
      parameters:
        - name: petId
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/HomeSummary' }

  # ---------------- 公告 / 反馈 ----------------
  /announcements:
    parameters:
      - name: active
        in: query
        schema: { type: boolean }
    get:
      tags: [content]
      summary: 公告列表
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Announcement' }

  /announcements/{id}/dismiss:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    post:
      tags: [content]
      summary: 关闭公告（用户维度）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /feedbacks:
    post:
      tags: [content]
      summary: 提交意见反馈
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                type: { type: string, enum: [bug, feature, other], default: bug }
                text: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Ok' }

  # ---------------- 品种 ----------------
  /breeds:
    parameters:
      - name: species
        in: query
        schema: { type: string, enum: [cat, dog, other] }
      - name: keyword
        in: query
        schema: { type: string }
    get:
      tags: [content]
      summary: 品种列表
      responses:
        '200': { $ref: '#/components/responses/AnyData' }

  /breeds/{id}:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    get:
      tags: [content]
      summary: 品种详情
      responses:
        '200': { $ref: '#/components/responses/AnyData' }

  # ---------------- 收藏 ----------------
  /favorites:
    get:
      tags: [content]
      summary: 收藏列表
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AnyData' }
    post:
      tags: [content]
      summary: 添加收藏
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [kind, targetId]
              properties:
                kind: { type: string, enum: [breed, post, tip] }
                targetId: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Ok' }

  /favorites/{kind}/{targetId}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [breed, post, tip] }
      - name: targetId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [content]
      summary: 取消收藏
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: 已取消 }

  # ---------------- 识别 ----------------
  /recognitions:
    get:
      tags: [recognition]
      summary: 识别历史
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AnyData' }
    post:
      tags: [recognition]
      summary: 同步识别（CV 模型）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image: { type: string, format: binary }
                petId: { type: string }
      responses:
        '200':
          description: 识别结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RecognitionResult' }

  # ---------------- 问诊 ----------------
  /consult/dictionary:
    get:
      tags: [consult]
      summary: 结构化问诊词典（部位/症状/时长/严重程度/伴随）
      responses:
        '200': { $ref: '#/components/responses/AnyData' }

  /consult/departments:
    get:
      tags: [consult]
      summary: 科室列表
      responses:
        '200': { $ref: '#/components/responses/AnyData' }

  /consult/modes:
    get:
      tags: [consult]
      summary: 问诊方式与价格
      responses:
        '200': { $ref: '#/components/responses/AnyData' }

  /consult/ai-quota:
    get:
      tags: [consult]
      summary: AI 免费额度
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AiQuota' }

  /consult/triage:
    post:
      tags: [consult]
      summary: AI 自由文本分诊（消耗一次额度）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                petId: { type: string }
                sessionId: { type: string }
                images:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: 分诊结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessionId: { type: string }
                          triage: { $ref: '#/components/schemas/TriageResult' }
                          reply: { type: string }
                          quota: { $ref: '#/components/schemas/AiQuota' }
        '429':
          description: 额度已用尽
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /consult/pre-consult:
    post:
      tags: [consult]
      summary: 结构化预问诊提交（返回分诊并生成报告）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PreConsultInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          triage: { $ref: '#/components/schemas/TriageResult' }
                          reportId: { type: string }

  /consult/case-summary:
    post:
      tags: [consult]
      summary: 生成 AI 病例摘要（转真人时携带）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                petId: { type: string }
                symptomLabels:
                  type: array
                  items: { type: string }
                note: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AnyData' }

  /consult/orders:
    get:
      tags: [consult]
      summary: 问诊单列表
      security: [{ bearerAuth: [] }]
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [ongoing, pending, replied, closed] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ConsultOrder' }
    post:
      tags: [consult]
      summary: 创建问诊单（下单）
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201':
          description: 下单成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConsultOrder' }

  /consult/orders/{id}:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    get:
      tags: [consult]
      summary: 问诊单详情（含消息）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConsultOrder' }

  /consult/orders/{id}/messages:
    parameters:
      - { $ref: '#/components/parameters/PathId' }
      - name: beforeId
        in: query
        schema: { type: string }
      - name: limit
        in: query
        schema: { type: integer, default: 50 }
    get:
      tags: [consult]
      summary: 拉取问诊消息
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          list:
                            type: array
                            items: { $ref: '#/components/schemas/ConsultMessage' }
                          hasMore: { type: boolean }
    post:
      tags: [consult]
      summary: 发送问诊消息
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                images:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: 发送成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConsultMessage' }

  /consult/orders/{id}/close:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    post:
      tags: [consult]
      summary: 结束问诊（同时生成真人报告）
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          state: { type: string, example: closed }
                          reportId: { type: string }

  /consult/orders/{id}/rating:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    post:
      tags: [consult]
      summary: 提交医生评价
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                tags:
                  type: array
                  items: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }

  /consult/reports:
    get:
      tags: [consult]
      summary: 问诊报告列表
      security: [{ bearerAuth: [] }]
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [ai, human] }
        - name: petId
          in: query
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AnyData' }
    post:
      tags: [consult]
      summary: 保存问诊报告
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportInput' }
      responses:
        '201':
          description: 已保存
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Report' }

  /consult/reports/{id}:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    get:
      tags: [consult]
      summary: 报告详情
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Report' }

  /consult/reports/{id}/archive:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    post:
      tags: [consult]
      summary: 报告回流健康档案（幂等）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AnyData' }

  /consult/reports/{id}/remind:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    post:
      tags: [consult]
      summary: 处方/复查转日程提醒（幂等）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AnyData' }

  # ---------------- 医生 ----------------
  /doctors:
    get:
      tags: [consult]
      summary: 医生列表
      parameters:
        - name: dept
          in: query
          schema: { type: string }
        - name: online
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [default, rating, consults, response], default: default }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Page'
                          - type: object
                            properties:
                              list:
                                type: array
                                items: { $ref: '#/components/schemas/Doctor' }
                              onlineCount: { type: integer }

  /doctors/{id}:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    get:
      tags: [consult]
      summary: 医生详情（含评价）
      responses:
        '200': { $ref: '#/components/responses/AnyData' }

  # ---------------- 社区 ----------------
  /posts:
    get:
      tags: [community]
      summary: 动态列表
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/AnyData' }
    post:
      tags: [community]
      summary: 发布动态
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                images:
                  type: array
                  items: { type: string }
                tags:
                  type: array
                  items: { type: string }
      responses:
        '201': { $ref: '#/components/responses/AnyData' }

  /posts/{id}/like:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    post:
      tags: [community]
      summary: 点赞
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AnyData' }
    delete:
      tags: [community]
      summary: 取消点赞
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AnyData' }

  /posts/{id}/comments:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    get:
      tags: [community]
      summary: 评论列表
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AnyData' }
    post:
      tags: [community]
      summary: 发表评论
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        '201': { $ref: '#/components/responses/AnyData' }

  # ---------------- IM ----------------
  /conversations:
    get:
      tags: [im]
      summary: 会话列表
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AnyData' }

  /conversations/{id}/messages:
    parameters: [{ $ref: '#/components/parameters/PathId' }]
    get:
      tags: [im]
      summary: 会话消息
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AnyData' }
    post:
      tags: [im]
      summary: 发送消息
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                images:
                  type: array
                  items: { type: string }
      responses:
        '201': { $ref: '#/components/responses/AnyData' }

  # ---------------- 文件 ----------------
  /files:
    post:
      tags: [files]
      summary: 通用文件上传
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
                scene:
                  type: string
                  enum: [avatar, post, recognition, consult]
      responses:
        '201': { $ref: '#/components/responses/AnyData' }

  # ---------------- 管理端 ----------------
  /admin/overview:
    get:
      tags: [admin]
      summary: 数据概览
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AnyData' }

  /admin/announcements:
    get:
      tags: [admin]
      summary: 公告列表（含未启用）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { $ref: '#/components/responses/AnyData' }
    post:
      tags: [admin]
      summary: 新建公告
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnouncementInput' }
      responses:
        '201': { $ref: '#/components/responses/AnyData' }

  /admin/feedbacks:
    get:
      tags: [admin]
      summary: 反馈列表
      security: [{ bearerAuth: [] }]
      parameters:
        - name: state
          in: query
          schema: { type: string, enum: [open, processing, resolved] }
      responses:
        '200': { $ref: '#/components/responses/AnyData' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT accessToken，有效期 2 小时；过期用 refreshToken 换新'

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, default: 20 }

  responses:
    Ok:
      description: 成功
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    AnyData:
      description: 成功（结构详见 API.md 对应章节）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Unauthorized:
      description: 未登录或令牌无效（code=20001/20002/20003）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }

  schemas:
    Envelope:
      type: object
      properties:
        code: { type: integer, example: 0, description: '0 成功，非 0 见 API.md 错误码表' }
        message: { type: string, example: ok }
        data: { nullable: true }
        timestamp: { type: integer, example: 1760000000000 }
        traceId: { type: string, example: 'req_8f3a1b2c' }

    Page:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        hasMore: { type: boolean }

    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 7200 }

    User:
      type: object
      properties:
        id: { type: string, example: '10001' }
        phone: { type: string }
        phoneMasked: { type: string, example: '138****1111' }
        name: { type: string, example: 林小满 }
        handle: { type: string, example: '@manman' }
        avatarUrl: { type: string, nullable: true }
        bio: { type: string }
        followers: { type: integer }
        following: { type: integer }

    LoginResult:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          properties:
            user: { $ref: '#/components/schemas/User' }

    Pet:
      type: object
      properties:
        id: { type: string, example: mochi }
        name: { type: string, example: 麻薯 }
        species: { type: string, enum: [cat, dog, other] }
        breed: { type: string, example: 英国短毛猫 }
        age: { type: number, example: 3 }
        weight: { type: number, example: 4.6 }
        gender: { type: string, enum: [公, 母] }
        tagline: { type: string }
        healthScore: { type: integer, example: 86 }
        nextVaccine: { type: string, format: date }
        birthday: { type: string, format: date }
        avatarUrl: { type: string, nullable: true }

    PetInput:
      type: object
      properties:
        name: { type: string }
        species: { type: string, enum: [cat, dog, other] }
        breed: { type: string }
        gender: { type: string, enum: [公, 母] }
        birthday: { type: string, format: date }
        weight: { type: number }
        tagline: { type: string }

    PetDetail:
      allOf:
        - $ref: '#/components/schemas/Pet'
        - type: object
          properties:
            weightTrend: { type: string, enum: [up, down, flat] }
            recordCount: { type: integer }
            pendingSchedule: { type: integer }

    TrendPoint:
      type: object
      properties:
        day: { type: string, example: 一 }
        value: { type: integer, example: 92 }
        label: { type: string, enum: [优, 良, 需关注] }

    Reminder:
      type: object
      properties:
        id: { type: string }
        icon: { type: string, example: calendar-check }
        label: { type: string, example: 年度疫苗 }
        date: { type: string, example: '11-02' }
        state: { type: string, enum: [good, watch, overdue] }

    HealthRecord:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [weight, diet, symptom, care] }
        date: { type: string, format: date }
        value: { type: number, nullable: true }
        note: { type: string }
        source: { type: integer, enum: [1, 2], description: '1 用户录入 / 2 问诊回流' }

    HealthRecordInput:
      type: object
      required: [kind, date]
      properties:
        kind: { type: string, enum: [weight, diet, symptom, care] }
        date: { type: string, format: date }
        value: { type: number }
        note: { type: string }

    ScheduleItem:
      type: object
      properties:
        id: { type: string }
        petId: { type: string, nullable: true }
        title: { type: string, example: 体外驱虫 }
        type: { type: string, enum: [vaccine, deworm, check, weight, groom, other] }
        date: { type: string, format: date }
        cycle: { type: string, example: 每月一次 }
        custom: { type: boolean }
        done: { type: boolean }
        state: { type: string, enum: [overdue, today, soon, future] }

    ScheduleItemInput:
      type: object
      properties:
        petId: { type: string }
        title: { type: string }
        type: { type: string, enum: [vaccine, deworm, check, weight, groom, other] }
        date: { type: string, format: date }

    HomeSummary:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        pets:
          type: array
          items: { $ref: '#/components/schemas/Pet' }
        currentPetId: { type: string }
        greeting: { type: string, example: 下午好 }
        trend:
          type: array
          items: { $ref: '#/components/schemas/TrendPoint' }
        reminders:
          type: array
          items: { $ref: '#/components/schemas/Reminder' }
        announcements:
          type: array
          items: { $ref: '#/components/schemas/Announcement' }
        tips:
          type: array
          items: { $ref: '#/components/schemas/Tip' }
        quickActions:
          type: array
          items: { $ref: '#/components/schemas/QuickAction' }
        aiQuota: { $ref: '#/components/schemas/AiQuota' }
        ongoingConsultCount: { type: integer }

    Announcement:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        body: { type: string }
        date: { type: string, format: date }
        level: { type: string, enum: [event, warn, info] }
        active: { type: boolean }

    AnnouncementInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string }
        body: { type: string }
        level: { type: string, enum: [event, warn, info], default: info }
        active: { type: boolean, default: true }

    Tip:
      type: object
      properties:
        id: { type: integer }
        tag: { type: string, example: 今日贴士 }
        title: { type: string }
        body: { type: string }
        tone: { type: string, enum: [sage, peach, coral] }

    QuickAction:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        sub: { type: string }
        icon: { type: string }
        route: { type: string }
        accent: { type: boolean }

    RecognitionResult:
      type: object
      properties:
        id: { type: string }
        title: { type: string, example: 英国短毛猫 }
        sci: { type: string, example: Felis catus }
        confidence: { type: number, example: 0.96 }
        species: { type: string }
        breedId: { type: string }
        metrics:
          type: array
          items:
            type: object
            properties:
              label: { type: string, example: 品种匹配 }
              value: { type: string, example: 96% }
              state: { type: string, enum: [good, watch, risk] }
        note: { type: string }

    AiQuota:
      type: object
      properties:
        date: { type: string, format: date }
        free: { type: integer, example: 3 }
        used: { type: integer, example: 1 }
        left: { type: integer, example: 2 }

    TriageResult:
      type: object
      description: 分诊结论（前端 TriageCard 直接消费）
      properties:
        level: { type: string, enum: [emergency, urgent, home] }
        score: { type: integer, example: 6 }
        label: { type: string, example: 建议尽快就诊 }
        short: { type: string, example: 24 小时内预约医生 }
        advice: { type: string }
        causes:
          type: array
          items: { type: string }
        actions:
          type: array
          items: { type: string }
        followUp: { type: string }
        dept: { type: string, description: 推荐科室 id }
        factors:
          type: array
          description: 可解释评分依据，务必返回
          items:
            type: object
            properties:
              text: { type: string, example: '已持续「2–3 天」' }
              w: { type: integer, nullable: true, example: 1 }
              danger: { type: boolean, description: 'true 表示高危一票否决项' }

    PreConsultInput:
      type: object
      required: [petId, partId, symptomIds]
      properties:
        petId: { type: string }
        partId: { type: string, example: digest }
        symptomIds:
          type: array
          items: { type: string }
          example: [vomit, appetite]
        durationId: { type: string, example: 2-3d }
        severityId: { type: string, example: mid }
        accompanyIds:
          type: array
          items: { type: string }
        note: { type: string }
        photoCount: { type: integer }
        saveReport: { type: boolean, default: true }

    Doctor:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        title: { type: string, example: 主治医师 }
        dept: { type: string, example: internal }
        deptLabel: { type: string, example: 犬猫内科 }
        hospital: { type: string }
        years: { type: integer }
        rating: { type: number, example: 4.9 }
        consults: { type: integer }
        online: { type: boolean }
        responseMin: { type: integer }
        tags:
          type: array
          items: { type: string }
        slot: { type: string }
        avatarUrl: { type: string, nullable: true }

    ConsultOrder:
      type: object
      properties:
        id: { type: string }
        doctorId: { type: string }
        mode: { type: string, enum: [text, voice, video] }
        petId: { type: string }
        summary: { type: object, description: AI 病例摘要 }
        price: { type: number, example: 59 }
        state: { type: string, enum: [pending, replied, closed] }
        createdAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ConsultMessage' }
        doctor: { $ref: '#/components/schemas/Doctor' }
        pet: { $ref: '#/components/schemas/Pet' }
        lastMessage: { $ref: '#/components/schemas/ConsultMessage' }
        unread: { type: integer }

    ConsultMessage:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [user, doctor, system, rx] }
        text: { type: string }
        images:
          type: array
          items: { type: string }
        drugs:
          type: array
          items: { $ref: '#/components/schemas/Drug' }
        note: { type: string }
        createdAt: { type: string, format: date-time }

    Drug:
      type: object
      properties:
        name: { type: string, example: 硫糖铝片 }
        dose: { type: string, example: 每次 250mg }
        usage: { type: string, example: 每日 2 次，连用 3 天 }
        days: { type: integer, example: 3 }

    OrderInput:
      type: object
      required: [doctorId, mode, petId]
      properties:
        doctorId: { type: string }
        mode: { type: string, enum: [text, voice, video] }
        petId: { type: string }
        summary: { type: object }
        price: { type: number, description: 服务端需校验与 doctor×mode 一致 }

    ReportInput:
      type: object
      required: [type, petId]
      properties:
        type: { type: string, enum: [ai, human] }
        petId: { type: string }
        petName: { type: string }
        orderId: { type: string, nullable: true }
        title: { type: string }
        preview: { type: string }
        chief: { $ref: '#/components/schemas/ChiefComplaint' }
        triage: { $ref: '#/components/schemas/TriageResult' }
        doctor:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            title: { type: string }
        doctorAdvice: { type: string }
        rx: { $ref: '#/components/schemas/Prescription' }

    ChiefComplaint:
      type: object
      description: 结构化主诉
      properties:
        partLabel: { type: string, example: 消化系统 }
        symptomLabels:
          type: array
          items: { type: string }
        durationLabel: { type: string, example: '2–3 天' }
        severityLabel: { type: string, example: '明显不适 · 但能进食' }
        accompanyLabels:
          type: array
          items: { type: string }
        note: { type: string }
        photos: { type: integer }

    Prescription:
      type: object
      properties:
        drugs:
          type: array
          items: { $ref: '#/components/schemas/Drug' }
        note: { type: string }

    Report:
      allOf:
        - $ref: '#/components/schemas/ReportInput'
        - type: object
          properties:
            id: { type: string }
            date: { type: string, format: date }
            createdAt: { type: string, format: date-time }
            archived: { type: boolean, description: 是否已回流健康档案 }
            reminded: { type: boolean, description: 是否已生成日程提醒 }
