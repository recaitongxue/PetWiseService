[project]
name = "petwise-service"
version = "0.1.0"
description = "PetWise monorepo development environment"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "datamodel-code-generator>=0.25",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "langgraph>=0.2",
    "matplotlib>=3.8",
    "minio>=7.2",
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.1.0",
    "opencv-python-headless>=4.10",
    "pandas>=2.2",
    "pgvector>=0.2",
    "pillow>=10.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "redis>=5.0",
    "scikit-learn>=1.5",
    "sentence-transformers>=3.0",
    "sqlalchemy>=2.0",
    "torch>=2.3",
    "torchvision>=0.18",
    "tqdm>=4.66",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.uv]
package = false