[project]
name = "petwise-api"
version = "0.1.0"
description = "Petwise 业务后端（FastAPI）：对外唯一网关与业务数据持有者"
requires-python = ">=3.11"
readme = "README.md"

# 注意：这里刻意不依赖 torch / transformers —— 重依赖属于 vision 与 agent 服务，
# 保持主后端轻量才能保证启动速度与镜像体积。
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "alembic>=1.13",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "minio>=7.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
